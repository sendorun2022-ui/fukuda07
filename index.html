<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神経衰弱</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #333;
    padding: 20px;
  }

  h1 {
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }

  .info {
    display: flex;
    gap: 24px;
    background: #fff;
    padding: 10px 28px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    margin-bottom: 20px;
    font-size: 18px;
    font-weight: bold;
  }

  .info span {
    color: #764ba2;
  }

  #startBtn {
    padding: 10px 24px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 30px;
    background: #ff9800;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    margin-bottom: 22px;
    transition: transform 0.1s;
  }

  #startBtn:active {
    transform: scale(0.95);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 80px);
    grid-template-rows: repeat(4, 80px);
    gap: 12px;
    perspective: 1000px;
  }

  .card {
    width: 80px;
    height: 80px;
    cursor: pointer;
    position: relative;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 0.45s;
    transform-style: preserve-3d;
    border-radius: 12px;
  }

  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }

  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }

  .back {
    background: linear-gradient(135deg, #f6d365, #fda085);
  }

  .back::after {
    content: "?";
    font-size: 30px;
    font-weight: bold;
    color: rgba(255,255,255,0.85);
  }

  .front {
    background: #fff;
    transform: rotateY(180deg);
  }

  .card.matched .front {
    background: #d9f7e5;
    animation: matchPop 0.4s ease;
  }

  @keyframes matchPop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.15); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  .card.matched {
    cursor: default;
  }

  .card.shake .card-inner {
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0) rotateY(0deg); }
    20% { transform: translateX(-6px) rotateY(0deg); }
    40% { transform: translateX(6px) rotateY(0deg); }
    60% { transform: translateX(-4px) rotateY(0deg); }
    80% { transform: translateX(4px) rotateY(0deg); }
  }

  .message {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
    height: 30px;
    text-align: center;
  }
</style>
</head>
<body>

  <h1>🧠 神経衰弱 🃏</h1>

  <div class="info">
    <div>手数: <span id="moves">0</span></div>
    <div>ペア: <span id="pairs">0</span> / 8</div>
    <div>経過時間: <span id="time">0</span>秒</div>
  </div>

  <button id="startBtn">スタート</button>

  <div class="board" id="board"></div>

  <div class="message" id="message"></div>

<script>
  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const timeEl = document.getElementById('time');
  const startBtn = document.getElementById('startBtn');
  const messageEl = document.getElementById('message');

  const SYMBOLS = ['🍎', '🍇', '🍉', '🍋', '🍓', '🍑', '🍒', '🍍'];

  // ---- 効果音(Web Audio APIでその場合成、外部音源ファイル不使用) ----
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playTone(freq, duration, type = 'sine', startDelay = 0, volume = 0.2) {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    const startTime = ctx.currentTime + startDelay;
    gain.gain.setValueAtTime(volume, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  function playFlipSound() {
    playTone(520, 0.08, 'triangle', 0, 0.15);
  }

  function playMatchSound() {
    playTone(660, 0.12, 'sine', 0, 0.2);
    playTone(880, 0.16, 'sine', 0.1, 0.2);
    playTone(1046, 0.2, 'sine', 0.2, 0.2);
  }

  function playMismatchSound() {
    playTone(220, 0.18, 'sawtooth', 0, 0.12);
    playTone(180, 0.22, 'sawtooth', 0.12, 0.12);
  }

  function playWinSound() {
    [523, 659, 784, 1046].forEach((freq, i) => {
      playTone(freq, 0.22, 'sine', i * 0.14, 0.22);
    });
  }

  let cards = [];
  let flippedCards = [];
  let matchedCount = 0;
  let moves = 0;
  let elapsedTime = 0;
  let timerInterval = null;
  let isBusy = false;
  let gameRunning = false;

  function shuffle(array) {
    const arr = array.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildBoard() {
    board.innerHTML = '';
    const deck = shuffle([...SYMBOLS, ...SYMBOLS]);

    deck.forEach((symbol, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.symbol = symbol;
      card.dataset.index = index;

      const inner = document.createElement('div');
      inner.className = 'card-inner';

      const back = document.createElement('div');
      back.className = 'face back';

      const front = document.createElement('div');
      front.className = 'face front';
      front.textContent = symbol;

      inner.appendChild(back);
      inner.appendChild(front);
      card.appendChild(inner);

      card.addEventListener('click', () => handleCardClick(card));
      board.appendChild(card);
    });
  }

  function handleCardClick(card) {
    if (!gameRunning) return;
    if (isBusy) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
    if (flippedCards.length === 2) return;

    card.classList.add('flipped');
    flippedCards.push(card);
    playFlipSound();

    if (flippedCards.length === 2) {
      moves++;
      movesEl.textContent = moves;
      checkMatch();
    }
  }

  function checkMatch() {
    isBusy = true;
    const [first, second] = flippedCards;

    if (first.dataset.symbol === second.dataset.symbol) {
      playMatchSound();
      setTimeout(() => {
        first.classList.add('matched');
        second.classList.add('matched');
        flippedCards = [];
        isBusy = false;
        matchedCount++;
        pairsEl.textContent = matchedCount;

        if (matchedCount === SYMBOLS.length) {
          endGame(true);
        }
      }, 350);
    } else {
      playMismatchSound();
      first.classList.add('shake');
      second.classList.add('shake');
      setTimeout(() => {
        first.classList.remove('flipped', 'shake');
        second.classList.remove('flipped', 'shake');
        flippedCards = [];
        isBusy = false;
      }, 700);
    }
  }

  function startGame() {
    clearInterval(timerInterval);
    gameRunning = true;
    isBusy = false;
    flippedCards = [];
    matchedCount = 0;
    moves = 0;
    elapsedTime = 0;

    movesEl.textContent = moves;
    pairsEl.textContent = matchedCount;
    timeEl.textContent = elapsedTime;
    messageEl.textContent = '';
    startBtn.textContent = 'もう一度スタート';

    buildBoard();

    timerInterval = setInterval(() => {
      elapsedTime++;
      timeEl.textContent = elapsedTime;
    }, 1000);
  }

  function endGame(cleared) {
    gameRunning = false;
    clearInterval(timerInterval);
    if (cleared) {
      playWinSound();
      messageEl.textContent = `クリア！ 手数: ${moves}回 / タイム: ${elapsedTime}秒`;
    }
  }

  startBtn.addEventListener('click', startGame);
</script>

</body>
</html>
